[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-acoustic-intelligence"
version = "0.1.0"
description = "Document discovery, collection, and deterministic intelligence for BESS acoustic research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "tavily-python>=0.5,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bai = "bai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
